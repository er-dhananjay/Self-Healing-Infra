groups:
  - name: self-healing
    rules:
      - alert: NginxDown
        expr: probe_success{job="blackbox-nginx"} == 0
        for: 10s
        labels:
          severity: critical
        annotations:
          summary: "NGINX is down ({{ $labels.instance }})"

      - alert: HighCpuUsage
        expr: 100 - (avg(rate(node_cpu_seconds_total{mode="idle"}[30s])) * 100) > 90
        for: 20s
        labels:
          severity: warning
        annotations:
          summary: "CPU usage is above 90%"
